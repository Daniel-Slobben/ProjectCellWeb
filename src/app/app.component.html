<div [class]="'w3-top'">
  <div class="w3-bar w3-black w3-card centered-nav">
    <a class="w3-bar-item w3-button w3-padding-large"
       (click)="show('world')"
       [class.selected]="view() === 'world'">
      World
    </a>
    <a class="w3-bar-item w3-button w3-padding-large"
       (click)="show('explanation')"
       [class.selected]="view() === 'explanation'">
      About
    </a>
    @if (view() === 'world') {
      <button class="w3-bar-item w3-button w3-padding-large disabled wrap">
        x: {{viewCenter.x()}}<wbr> y:&nbsp;{{viewCenter.y()}}
      </button>
    }
  </div>
</div>

<app-world-of-cells [hidden]="view() !== 'world'"></app-world-of-cells>
@if (view() === 'explanation') {
  <app-explanation></app-explanation>
}
