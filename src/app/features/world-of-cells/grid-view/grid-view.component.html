<canvas
  #gridCanvas
  [style.border]="'1px solid #ccc'"
  [style.display]="'block'"
  [style.background-color]="'white'">
</canvas>
<div [class]="'w3-bottom'">
  <div class="w3-bar w3-black w3-card centered-nav">
    <button class="w3-bar-item w3-button w3-padding-large"
            (click)="stepView(-1)"
            title="Previous">
      <arrow-icon class="left"></arrow-icon>
    </button>
    @if (true) {
      <button class="w3-bar-item w3-button w3-padding-large"
              (click)="toggleBlockBorders()"
              [class.selected]="drawBorders">
        Borders
      </button>
    }
    <button class="w3-bar-item w3-button w3-padding-large"
            (click)="stepView(1)"
            title="Next">
      <arrow-icon></arrow-icon>
    </button>
  </div>
</div>
